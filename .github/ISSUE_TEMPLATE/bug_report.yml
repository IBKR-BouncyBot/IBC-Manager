name: Bug report
description: Report a reproducible IBC Manager defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, account numbers, TOTP seeds, or unredacted diagnostic bundles.
  - type: input
    id: version
    attributes:
      label: IBC Manager version
      placeholder: 1.0.21
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Java version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
